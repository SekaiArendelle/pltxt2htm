[workspace]
name = "pltxt2htm-dev"
version = "0.27.0"  # Generated by gen_version.py, do not edit
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]

[activation.env]
LD_LIBRARY_PATH = "$CONDA_PREFIX/lib"
TEMP = "$PIXI_PROJECT_ROOT/.tmp"
TMP = "$PIXI_PROJECT_ROOT/.tmp"
TMPDIR = "$PIXI_PROJECT_ROOT/.tmp"
# Absolute paths to the default-feature build tools (cmake, ninja). Tasks
# invoke these variables instead of bare command names so that an incomplete
# environment fails loudly instead of falling back to a host-installed tool.
# Variables for tools provided by an optional feature live in that feature's
# activation env, so an environment only carries paths it can actually provide.
PLTXT2HTM_CMAKE = "$CONDA_PREFIX/bin/cmake"
PLTXT2HTM_CTEST = "$CONDA_PREFIX/bin/ctest"
PLTXT2HTM_NINJA = "$CONDA_PREFIX/bin/ninja"

[target.win-64.activation.env]
# Activation env is expanded by the shell on POSIX, but pixi uses cmd-style
# expansion on Windows, so the Windows override must use %VAR% here.
TEMP = "%PIXI_PROJECT_ROOT%\\.tmp"
TMP = "%PIXI_PROJECT_ROOT%\\.tmp"
TMPDIR = "%PIXI_PROJECT_ROOT%\\.tmp"
PLTXT2HTM_CMAKE = "%CONDA_PREFIX%\\Library\\bin\\cmake.exe"
PLTXT2HTM_CTEST = "%CONDA_PREFIX%\\Library\\bin\\ctest.exe"
PLTXT2HTM_NINJA = "%CONDA_PREFIX%\\Library\\bin\\ninja.exe"

[dependencies]
cmake = "*"
ninja = "*"
git = "*"

[tasks]
# TEMP/TMP/TMPDIR are activated globally; tasks only need to make sure
# prepare-tmp runs before they invoke a tool that may use the temp directory.
prepare-tmp = "\"$PLTXT2HTM_CMAKE\" -E make_directory \"$PIXI_PROJECT_ROOT/.tmp\""
clean-tmp = "\"$PLTXT2HTM_CMAKE\" -E rm -rf \"$PIXI_PROJECT_ROOT/.tmp\""

[feature.clang.dependencies]
clangxx = ">=23"

[feature.clang.activation.env]
PLTXT2HTM_CLANGXX = "$CONDA_PREFIX/bin/clang++"

[feature.clang.target.win-64.activation.env]
PLTXT2HTM_CLANGXX = "%CONDA_PREFIX%\\Library\\bin\\clang++.exe"

[feature.clang.target.linux.activation.env]
CXXFLAGS = "$CXXFLAGS --gcc-toolchain=$CONDA_PREFIX"

[feature.clang.tasks]
configure-examples = { cmd = "\"$PLTXT2HTM_CMAKE\" -S examples -B examples/build-pixi-clang -G Ninja -DCMAKE_MAKE_PROGRAM=\"$PLTXT2HTM_NINJA\" -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=\"$PLTXT2HTM_CLANGXX\"", depends-on = ["prepare-tmp"] }
build-examples = { cmd = "\"$PLTXT2HTM_CMAKE\" --build examples/build-pixi-clang", depends-on = ["configure-examples"] }
run-example = { cmd = "examples/build-pixi-clang/{{ example }}", args = ["example"], depends-on = ["build-examples"] }
configure-cxxmodule-examples = { cmd = "\"$PLTXT2HTM_CMAKE\" -S cxxmodule/examples -B cxxmodule/examples/build-pixi-clang -G Ninja -DCMAKE_MAKE_PROGRAM=\"$PLTXT2HTM_NINJA\" -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=\"$PLTXT2HTM_CLANGXX\"", depends-on = ["prepare-tmp"] }
build-cxxmodule-examples = { cmd = "\"$PLTXT2HTM_CMAKE\" --build cxxmodule/examples/build-pixi-clang", depends-on = ["configure-cxxmodule-examples"] }
run-cxxmodule-example = { cmd = "cxxmodule/examples/build-pixi-clang/example", depends-on = ["build-cxxmodule-examples"] }
configure-cmd = { cmd = "\"$PLTXT2HTM_CMAKE\" -S cmd -B cmd/build-pixi-clang-{{ mode | lower }} -G Ninja -DCMAKE_MAKE_PROGRAM=\"$PLTXT2HTM_NINJA\" -DCMAKE_BUILD_TYPE={{ mode | capitalize }} -DCMAKE_CXX_COMPILER=\"$PLTXT2HTM_CLANGXX\"", args = [{ arg = "mode", default = "debug" }], depends-on = ["prepare-tmp"] }
build-cmd = { cmd = "\"$PLTXT2HTM_CMAKE\" --build cmd/build-pixi-clang-{{ mode | lower }}", args = [{ arg = "mode", default = "debug" }], depends-on = [{ task = "configure-cmd", args = ["{{ mode }}"] }] }
run-cmd = { cmd = "cmd/build-pixi-clang-{{ mode | lower }}/pltxt2htm {{ cli_args }}", args = [{ arg = "mode", default = "debug" }, { arg = "cli_args", default = "" }], depends-on = [{ task = "build-cmd", args = ["{{ mode }}"] }] }
configure-tests-clang = { cmd = "\"$PLTXT2HTM_CMAKE\" -S tests -B tests/build-pixi-clang{{ '-' ~ sanitizer if sanitizer != '' else '' }} -G Ninja -DCMAKE_MAKE_PROGRAM=\"$PLTXT2HTM_NINJA\" -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=\"$PLTXT2HTM_CLANGXX\" -DPLTXT2HTM_SANITIZER={{ sanitizer }}", args = [{ arg = "sanitizer", default = "" }], depends-on = ["prepare-tmp"] }
build-tests-clang = { cmd = "\"$PLTXT2HTM_CMAKE\" --build tests/build-pixi-clang{{ '-' ~ sanitizer if sanitizer != '' else '' }}", args = [{ arg = "sanitizer", default = "" }], depends-on = [{ task = "configure-tests-clang", args = ["{{ sanitizer }}"] }] }
test-clang = { cmd = "\"$PLTXT2HTM_CTEST\" --test-dir tests/build-pixi-clang{{ '-' ~ sanitizer if sanitizer != '' else '' }} --interactive-debug-mode 0 --output-on-failure", args = [{ arg = "sanitizer", default = "" }], depends-on = [{ task = "build-tests-clang", args = ["{{ sanitizer }}"] }] }
configure-c-static = { cmd = "\"$PLTXT2HTM_CMAKE\" -S c -B c/build-pixi-clang-static -G Ninja -DCMAKE_MAKE_PROGRAM=\"$PLTXT2HTM_NINJA\" -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=\"$PLTXT2HTM_CLANGXX\" -DBUILD_SHARED_LIBS=OFF", depends-on = ["prepare-tmp"] }
build-c-static = { cmd = "\"$PLTXT2HTM_CMAKE\" --build c/build-pixi-clang-static", depends-on = ["configure-c-static"] }
configure-c-shared = { cmd = "\"$PLTXT2HTM_CMAKE\" -S c -B c/build-pixi-clang-shared -G Ninja -DCMAKE_MAKE_PROGRAM=\"$PLTXT2HTM_NINJA\" -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=\"$PLTXT2HTM_CLANGXX\" -DBUILD_SHARED_LIBS=ON", depends-on = ["prepare-tmp"] }
build-c-shared = { cmd = "\"$PLTXT2HTM_CMAKE\" --build c/build-pixi-clang-shared", depends-on = ["configure-c-shared"] }

fuzzing-dirs = "\"$PLTXT2HTM_CMAKE\" -E make_directory fuzzing/corpus/common_parser fuzzing/corpus/fixedadv_parser fuzzing/corpus/plrichtext_parser fuzzing/corpus/fixedadv_roundtrip fuzzing/artifacts fuzzing/logs"
configure-fuzzing-clang = { cmd = "\"$PLTXT2HTM_CMAKE\" -S fuzzing -B fuzzing/build-pixi-clang{{ '-' ~ sanitizer if sanitizer != '' else '' }} -G Ninja -DCMAKE_MAKE_PROGRAM=\"$PLTXT2HTM_NINJA\" -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER=\"$PLTXT2HTM_CLANGXX\" -DPLTXT2HTM_SANITIZER={{ sanitizer }}", args = [{ arg = "sanitizer", default = "" }], depends-on = ["prepare-tmp"] }
build-fuzzing-clang = { cmd = "\"$PLTXT2HTM_CMAKE\" --build fuzzing/build-pixi-clang{{ '-' ~ sanitizer if sanitizer != '' else '' }}", args = [{ arg = "sanitizer", default = "" }], depends-on = [{ task = "configure-fuzzing-clang", args = ["{{ sanitizer }}"] }] }
fuzzing = { cmd = "../build-pixi-clang{{ '-' ~ sanitizer if sanitizer != '' else '' }}/{{ target }} ../corpus/{{ target }} ../seeds/{{ target }} -dict=../dictionaries/pltxt.dict -artifact_prefix=../artifacts/{{ target }}- {{ fuzzer_args }}", args = ["target", { arg = "sanitizer", default = "" }, { arg = "fuzzer_args", default = "" }], depends-on = [{ task = "build-fuzzing-clang", args = ["{{ sanitizer }}"] }, "fuzzing-dirs"], cwd = "fuzzing/logs" }
fuzzing-merge = { cmd = "../build-pixi-clang{{ '-' ~ sanitizer if sanitizer != '' else '' }}/{{ target }} -merge=1 ../seeds/{{ target }} ../corpus/{{ target }}", args = ["target", { arg = "sanitizer", default = "" }], depends-on = [{ task = "build-fuzzing-clang", args = ["{{ sanitizer }}"] }, "fuzzing-dirs"], cwd = "fuzzing/logs" }

[feature.gcc.dependencies]
gxx = ">=15"

[feature.gcc.activation.env]
PLTXT2HTM_GXX = "$CONDA_PREFIX/bin/g++"

# conda-forge GCC installs its driver under the target triple on Linux, so the
# g++ path has to be spelled out per platform (verified against the packages
# locked in pixi.lock). The gcc environment is limited to these platforms: CI
# only validates GCC on Linux, and the macOS driver name embeds the deployment
# target, so there is no stable path for it.
[feature.gcc.target.win-64.activation.env]
PLTXT2HTM_GXX = "%CONDA_PREFIX%\\Library\\bin\\g++.exe"

[feature.gcc.target.linux-64.activation.env]
PLTXT2HTM_GXX = "$CONDA_PREFIX/bin/x86_64-conda-linux-gnu-g++"

[feature.gcc.target.linux-aarch64.activation.env]
PLTXT2HTM_GXX = "$CONDA_PREFIX/bin/aarch64-conda-linux-gnu-g++"

[feature.gcc.tasks]
configure-tests-gcc = { cmd = "\"$PLTXT2HTM_CMAKE\" -S tests -B tests/build-pixi-gcc{{ '-' ~ sanitizer if sanitizer != '' else '' }} -G Ninja -DCMAKE_MAKE_PROGRAM=\"$PLTXT2HTM_NINJA\" -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=\"$PLTXT2HTM_GXX\" -DPLTXT2HTM_SANITIZER={{ sanitizer }}", args = [{ arg = "sanitizer", default = "" }], depends-on = ["prepare-tmp"] }
build-tests-gcc = { cmd = "\"$PLTXT2HTM_CMAKE\" --build tests/build-pixi-gcc{{ '-' ~ sanitizer if sanitizer != '' else '' }}", args = [{ arg = "sanitizer", default = "" }], depends-on = [{ task = "configure-tests-gcc", args = ["{{ sanitizer }}"] }] }
test-gcc = { cmd = "\"$PLTXT2HTM_CTEST\" --test-dir tests/build-pixi-gcc{{ '-' ~ sanitizer if sanitizer != '' else '' }} --interactive-debug-mode 0 --output-on-failure", args = [{ arg = "sanitizer", default = "" }], depends-on = [{ task = "build-tests-gcc", args = ["{{ sanitizer }}"] }] }
configure-cxxmodule-tests = { cmd = "\"$PLTXT2HTM_CMAKE\" -S cxxmodule/tests -B cxxmodule/tests/build-pixi-gcc -G Ninja -DCMAKE_MAKE_PROGRAM=\"$PLTXT2HTM_NINJA\" -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=\"$PLTXT2HTM_GXX\"", depends-on = ["prepare-tmp"] }
build-cxxmodule-tests = { cmd = "\"$PLTXT2HTM_CMAKE\" --build cxxmodule/tests/build-pixi-gcc", depends-on = ["configure-cxxmodule-tests"] }
test-cxxmodule = { cmd = "cxxmodule/tests/build-pixi-gcc/check_public_symbols", depends-on = ["build-cxxmodule-tests"] }

[feature.rust.dependencies]
rust = "*"

[feature.rust.tasks]
build-rust = { cmd = "cargo build --manifest-path rust/Cargo.toml --workspace", depends-on = ["prepare-tmp"], env = { CXX = "$PLTXT2HTM_CLANGXX" } }
test-rust = { cmd = "cargo test --manifest-path rust/Cargo.toml --workspace", depends-on = ["prepare-tmp"], env = { CXX = "$PLTXT2HTM_CLANGXX" } }
run-rust-example = { cmd = "cargo run --manifest-path rust/Cargo.toml -p {{ package }} --example {{ example }}", args = ["package", "example"], depends-on = ["prepare-tmp"], env = { CXX = "$PLTXT2HTM_CLANGXX" } }

[feature.wasm.dependencies]
emscripten = ">=4,<5"
nodejs = ">=22,<25"

[feature.wasm.activation.env]
PLTXT2HTM_EMCMAKE = "$CONDA_PREFIX/bin/emcmake"
PLTXT2HTM_NODE = "$CONDA_PREFIX/bin/node"

[feature.wasm.target.win-64.activation.env]
EM_NODE_JS = "%CONDA_PREFIX%\\node.exe"
PLTXT2HTM_EMCMAKE = "%CONDA_PREFIX%\\Library\\bin\\emcmake.bat"
PLTXT2HTM_NODE = "%CONDA_PREFIX%\\node.exe"

[feature.wasm.tasks]
# Emscripten 4.0.9 on conda-forge needs Binaryen 117, which cannot run its -O2+ wasm-opt flags.
configure-wasm = { cmd = "\"$PLTXT2HTM_EMCMAKE\" \"$PLTXT2HTM_CMAKE\" -S wasm -B wasm/build-pixi-{{ mode | lower }} -G Ninja -DCMAKE_MAKE_PROGRAM=\"$PLTXT2HTM_NINJA\" -DCMAKE_BUILD_TYPE={{ mode | capitalize }} -DCMAKE_EXE_LINKER_FLAGS_RELEASE=-O1", args = [{ arg = "mode", default = "debug" }], depends-on = ["prepare-tmp"] }
build-wasm = { cmd = "\"$PLTXT2HTM_CMAKE\" --build wasm/build-pixi-{{ mode | lower }}", args = [{ arg = "mode", default = "debug" }], depends-on = [{ task = "configure-wasm", args = ["{{ mode }}"] }] }
test-wasm = { cmd = "\"$PLTXT2HTM_NODE\" wasm/examples/basic.mjs wasm/build-pixi-{{ mode | lower }}/pltxt2htm.js", args = [{ arg = "mode", default = "debug" }], depends-on = [{ task = "build-wasm", args = ["{{ mode }}"] }] }

[feature.csharp.dependencies]
dotnet-sdk = ">=9,<10"

[feature.csharp.tasks]
build-csharp = { cmd = "dotnet build csharp/csharp.csproj --configuration Debug", depends-on = ["build-c-shared"], env = { DOTNET_CLI_HOME = "$PIXI_PROJECT_ROOT/.pixi", NUGET_SCRATCH = "$PIXI_PROJECT_ROOT/.pixi/nuget-scratch" } }
run-csharp = { cmd = "dotnet run --project csharp/csharp.csproj --configuration Debug --no-build", depends-on = ["build-csharp"], env = { DOTNET_CLI_HOME = "$PIXI_PROJECT_ROOT/.pixi", NUGET_SCRATCH = "$PIXI_PROJECT_ROOT/.pixi/nuget-scratch", LD_LIBRARY_PATH = "$PIXI_PROJECT_ROOT/c/build-pixi-clang-shared:$LD_LIBRARY_PATH", DYLD_LIBRARY_PATH = "$PIXI_PROJECT_ROOT/c/build-pixi-clang-shared:$DYLD_LIBRARY_PATH" } }

[feature.csharp.target.win-64.tasks]
run-csharp = { cmd = "dotnet run --project csharp/csharp.csproj --configuration Debug --no-build", depends-on = ["build-csharp"], env = { DOTNET_CLI_HOME = "$PIXI_PROJECT_ROOT/.pixi", NUGET_SCRATCH = "$PIXI_PROJECT_ROOT/.pixi/nuget-scratch", PATH = "$PIXI_PROJECT_ROOT/c/build-pixi-clang-shared;$PATH" } }

[feature.py.tasks]
configure-py = { cmd = "\"$PLTXT2HTM_CMAKE\" -S py -B py/build-pixi-{{ pixi.environment.name }} -G Ninja -DCMAKE_MAKE_PROGRAM=\"$PLTXT2HTM_NINJA\" -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=\"$PLTXT2HTM_CLANGXX\"", args = [], depends-on = ["prepare-tmp"] }
build-py = { cmd = "\"$PLTXT2HTM_CMAKE\" --build py/build-pixi-{{ pixi.environment.name }}", args = [], depends-on = ["configure-py"] }

[feature.py37.dependencies]
python = ">=3.7,<3.8"

[feature.py38.dependencies]
python = ">=3.8,<3.9"

[feature.py39.dependencies]
python = ">=3.9,<3.10"

[feature.py310.dependencies]
python = ">=3.10,<3.11"

[feature.py311.dependencies]
python = ">=3.11,<3.12"

[feature.py312.dependencies]
python = ">=3.12,<3.13"

[feature.py313.dependencies]
python = ">=3.13,<3.14"

[feature.py314.dependencies]
python = ">=3.14,<3.15"

[feature.py315.dependencies]
python = ">=3.15,<3.16"

[feature.scripts.dependencies]
clangxx = ">=21"
llvm-tools = ">=21"
clang-tools = ">=21"
python = ">=3.10"

[feature.scripts.activation.env]
PLTXT2HTM_CLANGXX = "$CONDA_PREFIX/bin/clang++"
PLTXT2HTM_LLVM_NM = "$CONDA_PREFIX/bin/llvm-nm"
PLTXT2HTM_PYTHON = "$CONDA_PREFIX/bin/python"

[feature.scripts.target.win-64.activation.env]
PLTXT2HTM_CLANGXX = "%CONDA_PREFIX%\\Library\\bin\\clang++.exe"
PLTXT2HTM_LLVM_NM = "%CONDA_PREFIX%\\Library\\bin\\llvm-nm.exe"
PLTXT2HTM_PYTHON = "%CONDA_PREFIX%\\python.exe"

[feature.scripts.tasks]
# One task per Python script in scripts/.
gen-compile-commands = { cmd = "\"$PLTXT2HTM_PYTHON\" scripts/gen_compile_commands.py --compiler \"$PLTXT2HTM_CLANGXX\"", depends-on = ["prepare-tmp"] }
gen-dockerignore = "\"$PLTXT2HTM_PYTHON\" scripts/gen_dockerignore.py"
gen-format-ninja = "\"$PLTXT2HTM_PYTHON\" scripts/gen_format_ninja.py"
gen-html-named-character-references = "\"$PLTXT2HTM_PYTHON\" scripts/gen_html_named_character_references.py"
gen-version = "\"$PLTXT2HTM_PYTHON\" scripts/gen_version.py"
run-clang-tidy = "\"$PLTXT2HTM_PYTHON\" scripts/run_clang_tidy.py"
windows-symbols = "\"$PLTXT2HTM_PYTHON\" scripts/gen_windows_symbols.py --clang \"$PLTXT2HTM_CLANGXX\" --llvm-nm \"$PLTXT2HTM_LLVM_NM\""
windows-symbols-check = "\"$PLTXT2HTM_PYTHON\" scripts/gen_windows_symbols.py --clang \"$PLTXT2HTM_CLANGXX\" --llvm-nm \"$PLTXT2HTM_LLVM_NM\" --check"
git-clang-format-diff = "git-clang-format --diff main"
git-clang-format = "git-clang-format --force main"

# Full-tree formatting is discouraged; prefer the git-clang-format tasks for changed lines.
format-all-cpp = { cmd = "\"$PLTXT2HTM_NINJA\" -f format_cpp.ninja", depends-on = ["gen-format-ninja"] }

[feature.scripts.target.win-64.tasks]
# The Windows launcher calls the system `py -3`; invoke the Pixi Python directly.
git-clang-format-diff = { cmd = "cmd /c \"\"%CONDA_PREFIX%\\python.exe\" \"%CONDA_PREFIX%\\Library\\bin\\git-clang-format\" --diff main\"" }
git-clang-format = { cmd = "cmd /c \"\"%CONDA_PREFIX%\\python.exe\" \"%CONDA_PREFIX%\\Library\\bin\\git-clang-format\" --force main\"" }

[environments]
default = []
clang = ["clang"]
# GCC is supported on Linux and Windows only. macOS is excluded: CI validates
# GCC only on Linux, and conda-forge's macOS GCC driver name embeds a
# deployment target, so there is no stable path for it.
gcc = { features = ["gcc"], platforms = ["linux-64", "linux-aarch64", "win-64"] }
rust = ["clang", "rust"]
wasm = { features = ["wasm"], platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"] }
csharp = ["clang", "csharp"]
scripts = ["scripts"]
py37 = { features = ["clang", "py", "py37"], platforms = ["linux-64", "linux-aarch64", "osx-64", "win-64"] }
py38 = ["clang", "py", "py38"]
py39 = ["clang", "py", "py39"]
py310 = ["clang", "py", "py310"]
py311 = ["clang", "py", "py311"]
py312 = ["clang", "py", "py312"]
py313 = ["clang", "py", "py313"]
py314 = ["clang", "py", "py314"]
py315 = ["clang", "py", "py315"]
